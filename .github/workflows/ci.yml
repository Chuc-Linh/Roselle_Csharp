name: C# Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x' # Đổi thành phiên bản .NET của cậu (6.0, 7.0, 8.0...)

      # Nếu thư mục chứa code C# nằm trong một folder riêng, ví dụ thư mục 'Backend'
      # Cậu chỉ định working-directory trực tiếp vào đó:
      - name: Restore dependencies
        run: dotnet restore
        working-directory: ./Backend

      - name: Build project
        run: dotnet build --no-restore --configuration Release
        working-directory: ./Backend

      - name: Run tests
        run: dotnet test --no-build --configuration Release
        working-directory: ./Backend