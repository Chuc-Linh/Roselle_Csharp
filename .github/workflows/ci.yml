name: CSharpShop CI and packages

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify on Windows
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore CSharpShop.sln
      - name: Build all projects
        run: dotnet build CSharpShop.sln --configuration Release --no-restore
      - name: Run test projects when available
        run: |
          $projects = @(Get-ChildItem -Recurse -Filter *.csproj | Where-Object {
            (Get-Content $_.FullName -Raw) -match '<IsTestProject>\s*true\s*</IsTestProject>|Microsoft.NET.Test.Sdk'
          })
          if ($projects.Count -eq 0) {
            Write-Host 'No automated test project yet. Build and API smoke check still run.'
          }
          foreach ($project in $projects) {
            dotnet test $project.FullName --configuration Release --no-build --logger trx --results-directory TestResults
            if ($LASTEXITCODE -ne 0) { throw "Tests failed: $($project.Name)" }
          }
      - name: Check API startup and response
        run: ./scripts/Test-ApiSmoke.ps1
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore
      - name: Upload API startup logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-startup-logs
          path: artifacts/smoke/*.log
          if-no-files-found: ignore
      - name: Publish API
        if: github.event_name != 'pull_request'
        run: dotnet publish src/CSharpShop.Api/CSharpShop.Api.csproj --configuration Release --no-build --no-restore --output artifacts/api
      - name: Publish WinForms for Windows x64
        if: github.event_name != 'pull_request'
        run: dotnet publish src/CSharpShop.Admin/CSharpShop.Admin.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/admin-win-x64
      - name: Upload API package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: CSharpShop-Api-${{ github.run_number }}
          path: artifacts/api/
          if-no-files-found: error
          retention-days: 14
      - name: Upload WinForms package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: CSharpShop-Admin-win-x64-${{ github.run_number }}
          path: artifacts/admin-win-x64/
          if-no-files-found: error
          retention-days: 14
